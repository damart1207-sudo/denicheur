name: Dénicheur

# Horaires en UTC (= heure fixe de Pékin toute l'année, la Chine ne change jamais d'heure)
#  toutes les heures (5 tours de 10 min dans un seul lancement) -> veille 24h/24 (très gros bons plans -> data/alertes.json, vérifiés par Claude chaque heure)
#  02:00 UTC = 10:00 à Pékin = 03:00 à Paris l'hiver  -> passage "europe" (comparaison + tableau)
on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      passage:
        description: "asie ou europe"
        default: "europe"
      test:
        description: "true = mode test gratuit (aucune IA appelée)"
        default: "false"
      verifier:
        description: "true = vérifier seulement les 5 clés (1 petit message par IA)"
        default: "false"
      sources:
        description: "true = tester les sources candidates"
        default: "false"
      rapports:
        description: "true = tester les rapports demande/concurrence"
        default: "false"
      comparateurs:
        description: "true = tester l'accès aux comparateurs"
        default: "false"
      veille:
        description: "true = un tour de veille"
        default: "false"
      playwright:
        description: "true = tester un vrai navigateur sur les sites bloqués"
        default: "false"
      outil:
        description: "nom d'un script de test dans outils/ (sans .py)"
        default: ""

permissions:
  contents: write

# Deux files séparées : la veille (en boucle) ne doit JAMAIS annuler le passage quotidien en attente.
# (Avant le 03/11 : une seule file, et le passage de 2 h UTC était annulé chaque nuit par la veille.)
concurrency:
  group: denicheur-${{ (github.event.inputs.veille == 'true' || github.event.schedule == '5 * * * *') && 'veille' || 'passage' }}
  cancel-in-progress: false

jobs:
  passage:
    runs-on: ubuntu-latest
    # garde-fou : 58 min pour la veille en boucle (5 tours espacés de 10 min), 25 min pour le reste
    timeout-minutes: ${{ (github.event.inputs.veille == 'true' || github.event.schedule == '5 * * * *') && 58 || 25 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lancer le passage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || secrets.DEEPSEEK }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY || secrets.ZAI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          PILOTERR_API_KEY: ${{ secrets.PILOTERR_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          PASSAGE="${{ github.event.inputs.passage }}"
          if [ "${{ github.event.schedule }}" = "0 2 * * *" ]; then PASSAGE=europe; fi
          [ -z "$PASSAGE" ] && PASSAGE=europe
          if [ -n "${{ github.event.inputs.outil }}" ]; then
            python "outils/${{ github.event.inputs.outil }}.py"
            exit 0
          fi
          if [ "${{ github.event.inputs.playwright }}" = "true" ]; then
            pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null
            python outils/test_playwright.py
            exit 0
          fi
          if [ "${{ github.event.schedule }}" = "5 * * * *" ] || [ "${{ github.event.inputs.veille }}" = "true" ]; then
            pip install -q pytrends "urllib3<2" || true
            git config user.name "denicheur-bot"
            git config user.email "denicheur-bot@users.noreply.github.com"
            # 5 tours espacés d'environ 10 minutes ; un tour qui plante n'arrête JAMAIS les suivants,
            # et chaque tour est enregistré tout de suite (rien n'est perdu).
            for i in 1 2 3 4 5; do
              DEBUT=$(date +%s)
              timeout 480 python -m denicheur.veille || python -m denicheur.sante echec "tour $i : code $?"
              python saas/construire_site.py || python -m denicheur.sante echec "site : construction"
              git add -A data docs
              if ! git diff --cached --quiet; then
                git commit -q -m "Veille $(date -u +%H:%M) (tour $i)"
                for essai in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break; sleep 10; done
              fi
              [ $i -lt 5 ] && sleep $(( 600 - ($(date +%s) - DEBUT) > 30 ? 600 - ($(date +%s) - DEBUT) : 30 ))
            done
            exit 0
          fi
          pip install -q pytrends "urllib3<2" || true
          if [ "${{ github.event.inputs.comparateurs }}" = "true" ]; then
            python -m denicheur --comparateurs
          elif [ "${{ github.event.inputs.rapports }}" = "true" ]; then
            python -m denicheur --rapports
          elif [ "${{ github.event.inputs.sources }}" = "true" ]; then
            python -m denicheur --sources
          elif [ "${{ github.event.inputs.verifier }}" = "true" ]; then
            python -m denicheur --verifier
          elif [ "${{ github.event.inputs.test }}" = "true" ]; then
            python -m denicheur --passage "$PASSAGE" --test
          else
            python -m denicheur --passage "$PASSAGE"
          fi

      - name: Enregistrer les résultats
        if: always()
        run: |
          git config user.name "denicheur-bot"
          git config user.email "denicheur-bot@users.noreply.github.com"
          mkdir -p data
          git add -A data docs
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -q -m "Passage du $(date -u +%Y-%m-%dT%H:%MZ)"
          # la veille tourne en parallèle et écrit les mêmes fichiers générés : en cas de conflit, la version
          # du passage gagne (-X theirs), puis la page est reconstruite au tour de veille suivant.
          for essai in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          echo "Impossible de pousser les résultats après 5 essais" && exit 1
