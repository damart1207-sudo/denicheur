name: Dénicheur

# Horaires en UTC (= heure fixe de Pékin toute l'année, la Chine ne change jamais d'heure)
#  toutes les heures (5 tours de 10 min dans un seul lancement) -> veille 24h/24 (très gros bons plans -> data/alertes.json, vérifiés par Claude chaque heure)
#  03:33 / 11:33 / 16:33 UTC -> passages nuit / midi / soir, rapports à 5 h, 13 h, 18 h (Paris, hiver)
on:
  schedule:
    # minutes décalées : GitHub saute souvent les horaires ronds quand il est chargé (nuit du 3 au 4/11 : passage de 2 h jamais lancé)
    # Trois rapports par jour, heure de Paris (hiver = UTC+1) : 5 h, 13 h, 18 h. Chaque passage dure ≈ 20 min, l'audit suit.
    - cron: "33 3 * * *"
    - cron: "33 11 * * *"
    - cron: "33 16 * * *"
    - cron: "23 * * * *"
    # lundi 05:03 UTC : rapport demande par pays (Amigo, ≈ 0,55 $ DataForSEO par semaine)
    - cron: "3 5 * * 1"
  workflow_dispatch:
    inputs:
      passage:
        description: "nuit, midi, soir (ou europe = nuit)"
        default: "nuit"
      test:
        description: "true = mode test gratuit (aucune IA appelée)"
        default: "false"
      verifier:
        description: "true = vérifier seulement les 5 clés (1 petit message par IA)"
        default: "false"
      sources:
        description: "true = tester les sources candidates"
        default: "false"
      rapports:
        description: "true = tester les rapports demande/concurrence"
        default: "false"
      comparateurs:
        description: "true = tester l'accès aux comparateurs"
        default: "false"
      veille:
        description: "true = un tour de veille"
        default: "false"
      playwright:
        description: "true = tester un vrai navigateur sur les sites bloqués"
        default: "false"
      outil:
        description: "nom d'un script de test dans outils/ (sans .py)"
        default: ""

permissions:
  contents: write
  actions: write   # la veille relance elle-même la veille suivante (GitHub saute la plupart des horaires programmés)

# Deux files séparées : la veille (en boucle) ne doit JAMAIS annuler le passage quotidien en attente.
# (Avant le 03/11 : une seule file, et le passage de 2 h UTC était annulé chaque nuit par la veille.)
concurrency:
  group: denicheur-${{ (github.event.inputs.veille == 'true' || github.event.schedule == '23 * * * *') && 'veille' || 'passage' }}
  cancel-in-progress: false

jobs:
  passage:
    runs-on: ubuntu-latest
    # garde-fou : la veille (4 tours de 10 min au plus, chacun coupé à 10 min + moisson 4 min) tient dans 70 min ;
    # un passage complet dure 40 à 45 min (délai interne 45 min) : 58 min pour qu'il ne soit jamais coupé avant d'avoir écrit.
    timeout-minutes: ${{ (github.event.inputs.veille == 'true' || github.event.schedule == '23 * * * *') && 70 || 58 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lancer le passage
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || secrets.DEEPSEEK }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY || secrets.ZAI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          PILOTERR_API_KEY: ${{ secrets.PILOTERR_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          PASSAGE="${{ github.event.inputs.passage }}"
          case "${{ github.event.schedule }}" in
            "33 3 * * *") PASSAGE=nuit ;;
            "33 11 * * *") PASSAGE=midi ;;
            "33 16 * * *") PASSAGE=soir ;;
          esac
          [ -z "$PASSAGE" ] && PASSAGE=europe
          if [ "${{ github.event.schedule }}" = "3 5 * * 1" ]; then
            python -m denicheur.demande_pays && python saas/rapport_david.py
            exit 0
          fi
          if [ -n "${{ github.event.inputs.outil }}" ]; then
            python "outils/${{ github.event.inputs.outil }}.py"
            exit 0
          fi
          if [ "${{ github.event.inputs.playwright }}" = "true" ]; then
            pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null
            python outils/test_playwright.py
            exit 0
          fi
          if [ "${{ github.event.schedule }}" = "23 * * * *" ] || [ "${{ github.event.inputs.veille }}" = "true" ]; then
            pip install -q pytrends "urllib3<2" || true
            git config user.name "denicheur-bot"
            git config user.email "denicheur-bot@users.noreply.github.com"
            # RATTRAPAGE : GitHub saute parfois un horaire programmé. Si le passage attendu pour ce créneau
            # (nuit 5 h, midi 13 h, soir 18 h Paris) n'a pas eu lieu, la veille le lance À PART (file « passage »,
            # 58 min) : avant le 04/11 il tournait ici même avec 25 min, était coupé, et la veille dépassait l'heure.
            # Une seule tentative par créneau et par jour (marque data/etat/rattrapage.json).
            MANQUANT=$(python outils/rattrapage.py)
            if [ -n "$MANQUANT" ]; then
              echo "Passage $MANQUANT manquant : rattrapage lancé dans une exécution séparée"
              python outils/rattrapage.py marquer "$MANQUANT"
              git add -A data/etat && git commit -q -m "Rattrapage $MANQUANT demandé" || true
              for essai in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break; sleep 10; done
              GH_TOKEN="${{ github.token }}" gh api -X POST repos/${{ github.repository }}/actions/workflows/denicheur.yml/dispatches \
                -f ref=main -f "inputs[passage]=$MANQUANT" || python -m denicheur.sante erreur "rattrapage $MANQUANT : lancement impossible"
            fi
            # 4 tours espacés d'environ 10 minutes ; un tour qui plante n'arrête JAMAIS les suivants,
            # et chaque tour est enregistré tout de suite (rien n'est perdu). Le tour s'arrête de lui-même
            # (budget interne 400 s d'examen, 520 s en tout) ; la coupure à 600 s n'est qu'un garde-fou.
            for i in 1 2 3 4; do
              DEBUT=$(date +%s)
              timeout -k 15 600 python -m denicheur.veille || python -m denicheur.sante echec "tour $i : code $? (coupé à 10 min)"
              # moissonneur Keepa : vide la réserve de jetons (ils expirent au bout d'une heure) -> radar Amazon, étagère, hype
              timeout -k 15 240 python -m denicheur.moisson || python -m denicheur.sante erreur "moisson tour $i : code $?"
              python saas/construire_site.py || python -m denicheur.sante echec "site : construction"
              python saas/rapport_hype.py || true
              python saas/rapport_david.py || true
              git add -A data docs
              if ! git diff --cached --quiet; then
                git commit -q -m "Veille $(date -u +%H:%M) (tour $i)"
                for essai in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break; sleep 10; done
              fi
              [ $i -lt 4 ] && sleep $(( 600 - ($(date +%s) - DEBUT) > 30 ? 600 - ($(date +%s) - DEBUT) : 30 ))
            done
            exit 0
          fi
          pip install -q pytrends "urllib3<2" || true
          if [ "${{ github.event.inputs.comparateurs }}" = "true" ]; then
            python -m denicheur --comparateurs
          elif [ "${{ github.event.inputs.rapports }}" = "true" ]; then
            python -m denicheur --rapports
          elif [ "${{ github.event.inputs.sources }}" = "true" ]; then
            python -m denicheur --sources
          elif [ "${{ github.event.inputs.verifier }}" = "true" ]; then
            python -m denicheur --verifier
          elif [ "${{ github.event.inputs.test }}" = "true" ]; then
            python -m denicheur --passage "$PASSAGE" --test
          else
            python -m denicheur --passage "$PASSAGE"
          fi

      - name: Relancer la veille suivante (chaîne continue, indépendante des horaires GitHub)
        if: always() && (github.event.inputs.veille == 'true' || github.event.schedule == '23 * * * *')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # une seule veille à la fois : si une autre est déjà en file ou en cours, on ne relance pas
          EN_COURS=$(gh run list -R ${{ github.repository }} -w "Dénicheur" -s in_progress --json databaseId --jq 'length' 2>/dev/null || echo 1)
          EN_FILE=$(gh run list -R ${{ github.repository }} -w "Dénicheur" -s queued --json databaseId --jq 'length' 2>/dev/null || echo 0)
          echo "en cours: $EN_COURS, en file: $EN_FILE"
          if [ "$EN_COURS" -le 1 ] && [ "$EN_FILE" -eq 0 ]; then
            gh api -X POST repos/${{ github.repository }}/actions/workflows/denicheur.yml/dispatches -f ref=main -f "inputs[veille]=true" && echo "veille suivante lancée"
          fi

      - name: Rapport de David (page à onglets)
        if: always()
        run: python saas/rapport_david.py || true

      - name: Enregistrer les résultats
        if: always()
        run: |
          git config user.name "denicheur-bot"
          git config user.email "denicheur-bot@users.noreply.github.com"
          mkdir -p data
          git add -A data docs
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -q -m "Passage du $(date -u +%Y-%m-%dT%H:%MZ)"
          # la veille tourne en parallèle et écrit les mêmes fichiers générés : en cas de conflit, la version
          # du passage gagne (-X theirs), puis la page est reconstruite au tour de veille suivant.
          for essai in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          echo "Impossible de pousser les résultats après 5 essais" && exit 1
