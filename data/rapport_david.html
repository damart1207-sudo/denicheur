es (ex. Prime Day, Black Friday britannique sous les 20-24 € HT) pour revendre sur la marketplace Amazon avec une marge unitaire brute très fine de 2 à 4 €.", "meilleure_piste": "Pour une micro-entreprise française, la seule option viable est de surveiller les lots de surstocks neufs scellés chez des courtiers B2B européens (DistriHUB, déstockeurs tech) ou l'arbitrage promotionnel, car les distributeurs officiels accordent des tarifs trop proches du prix public pour rivaliser avec la Buy Box Amazon.", "prix_achat_cible_eur": 20.0, "marge_possible_pct": 8.0, "risques": ["Contrefaçon quasi-systématique sur les plateformes chinoises directes (Alibaba, 1688, Taobao) pour cette référence", "Fiscalité micro-BIC française pénalisante : cotisations sociales calculées sur le chiffre d'affaires total (12,3 %) et commission Amazon (~15 %) qui écrasent la marge nette", "Guerre des prix agressive sur la Buy Box par des vendeurs UK opérant à marge résiduelle", "Garantie constructeur JBL/Harman refusée au client final si l'achat provient du circuit parallèle non agréé", "Frais de dédouanement et formalités d'importation imprévus en commandant chez des grossistes britanniques post-Brexit"], "message_negociation": "Bonjour,\nResponsable des achats pour une structure de vente au détail en France, je souhaite intégrer le casque JBL Tune 510BT Noir à notre offre.\nNous envisageons une première commande de test de 50 pièces, avec réassort mensuel selon rotation des ventes.\nPourriez-vous me transmettre votre meilleure grille tarifaire HT pour ce volume ainsi que vos conditions de livraison vers la France ?\nDans l'attente de vos éléments, bien cordialement.", "sources": ["https://fr.jbl.com", "https://www.europ-computer.com", "https://ishinetrade.co.uk", "https://www.also.com", "https://distrihub.eu"], "sources_google": [], "mot_cle": "jbl tune 510bt", "titre": "JBL Tune 510 BT - Noir", "asin": "B08QTYYNDN", "prix_fr": 48.22, "recherches_mois": 1000, "vendeurs": 5, "date": "2026-11-04",  else if(actif==="chasseur"){const C=D.chasse||[];html=`<div class="vide">Annonces de particuliers (Vinted, Leboncoin) trouvées par le Chasseur sur ton PC : sous-cotées (≤ 65 % du prix d'occasion), invisibles (titre mal écrit, lot) ou vendeur pressé. Mise à jour ${e(D.chasse_maj||"pas encore : attend le collecteur PC")} · ${e((D.chasse_etat||{}).recherches||0)} recherches, ${e((D.chasse_etat||{}).annonces_lues||0)} annonces lues au dernier tour.</div>`+(C.length?`<table><tr><th>Site</th><th>Annonce</th><th>Prix</th><th>Référence occasion</th><th>Écart</th><th>Signaux</th><th>Produit cherché</th><th>Vu</th></tr>`+C.map(x=>`<tr><td>${e(x.site)}</td><td><a href="${e(x.lien)}" target="_blank">${e(x.titre)}</a></td><td><b>${eur(x.prix)}</b></td><td>${eur(x.reference)}</td><td class="pct">${x.ecart_pct!=null?`-${e(x.ecart_pct)} %`:"—"}</td><td>${e((x.signaux||[]).join(", "))}</td><td>${e(x.produit)} <small>(${e(x.origine)})</small></td><td>${e((x.vu||"").slice(5,16).replace("T"," "))}</td></tr>`).join("")+"</table>":"");}
 else if(actif==="pays"){const P=D.demande_pays||{};const noms={FR:"🇫🇷 France",DE:"🇩🇪 Allemagne",ES:"🇪🇸 Espagne",IT:"🇮🇹 Italie",US:"🇺🇸 USA",JP:"🇯🇵 Japon"};
   html=`<div class="vide">Volume de recherches Google par pays (Amigo, DataForSEO, hebdomadaire — ${e(D.demande_pays_maj||"pas encore calculé")}) sur les produits de la base, croisé avec leur prix : qui cherche quoi, et dans quelle tranche de prix.</div>`;
   for(const [p,v] of Object.entries(P)){html+=`<h3>${noms[p]||p} — ${e(v.nb_avec_volume)} produits avec volume</h3><table><tr><th>Tranche de prix</th><th>Produits</th><th>Recherches / mois</th></tr>`+Object.entries(v.tranches||{}).map(([t,x])=>`<tr><td>${e(t)}</td><td>${e(x.produits)}</td><td><b>${e(x.recherches)}</b></td></tr>`).join("")+`</table><table><tr><th>#</th><th>Produit (mot-clé)</th><th>Recherches / mois</th><th>Prix</th><th>Vendeurs Amazon FR</th></tr>`+(v.top||[]).slice(0,30).map((x,i)=>`<tr><td>${i+1}</td><td><b>${e(x.mot_cle)}</b><br><small>${e(x.titre)}</small></td><td><b>${e(x.volume)}</b></td><td>${eur(x.prix)}</td><td>${e(x.vendeurs_amazon_fr)}</td></tr>`).join("")+"</table>";}
   if(!Object.keys(P).length)html+="<p>Première récolte lundi prochain (ou lancement manuel).</p>";}
 else if(actif==="outils"){html=`<table><tr><th>Outil</th><th>Consommé</th><th>Plafond</th><th>Appels</th></tr>`+D.outils.map(o=>`<tr><td>${e(o.outil)}</td><td>${e(o.mois)}</td><td>${e(o.plafond)}</td><td>${e(o.appels)}</td></tr>`).join("")+"</table>";}
 document.getElementById("s_"+actif).innerHTML=html;document.getElementById("compte").textContent=n?`${n} ligne(s)`:"";}
rendre();
