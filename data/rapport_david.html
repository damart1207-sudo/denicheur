es (ex. Prime Day, Black Friday britannique sous les 20-24 € HT) pour revendre sur la marketplace Amazon avec une marge unitaire brute très fine de 2 à 4 €.", "meilleure_piste": "Pour une micro-entreprise française, la seule option viable est de surveiller les lots de surstocks neufs scellés chez des courtiers B2B européens (DistriHUB, déstockeurs tech) ou l'arbitrage promotionnel, car les distributeurs officiels accordent des tarifs trop proches du prix public pour rivaliser avec la Buy Box Amazon.", "prix_achat_cible_eur": 20.0, "marge_possible_pct": 8.0, "risques": ["Contrefaçon quasi-systématique sur les plateformes chinoises directes (Alibaba, 1688, Taobao) pour cette référence", "Fiscalité micro-BIC française pénalisante : cotisations sociales calculées sur le chiffre d'affaires total (12,3 %) et commission Amazon (~15 %) qui écrasent la marge nette", "Guerre des prix agressive sur la Buy Box par des vendeurs UK opérant à marge résiduelle", "Garantie constructeur JBL/Harman refusée au client final si l'achat provient du circuit parallèle non agréé", "Frais de dédouanement et formalités d'importation imprévus en commandant chez des grossistes britanniques post-Brexit"], "message_negociation": "Bonjour,\nResponsable des achats pour une structure de vente au détail en France, je souhaite intégrer le casque JBL Tune 510BT Noir à notre offre.\nNous envisageons une première commande de test de 50 pièces, avec réassort mensuel selon rotation des ventes.\nPourriez-vous me transmettre votre meilleure grille tarifaire HT pour ce volume ainsi que vos conditions de livraison vers la France ?\nDans l'attente de vos éléments, bien cordialement.", "sources": ["https://fr.jbl.com", "https://www.europ-computer.com", "https://ishinetrade.co.uk", "https://www.also.com", "https://distrihub.eu"], "sources_google": [], "mot_cle": "jbl tune 510bt", "titre": "JBL Tune 510 BT - Noir", "asin": "B08QTYYNDN", "prix_fr": 48.22, "recherches_mois": 1000, "vendeurs": 5, "date": "2026-11-04",  return liste.filter(x=>(!f||x.feu===f)&&(!d||x.denicheur===d)&&(!p||x.pays===p)&&(isNaN(pm)||(x.prix??0)<=pm)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));}
function trier(liste){const t=document.getElementById("tri").value;const c=[...liste];
 if(t==="score_vente")c.sort((a,b)=>(b.score_vente??-1)-(a.score_vente??-1));else if(t==="prix_asc")c.sort((a,b)=>(a.prix??1e9)-(b.prix??1e9));else if(t==="prix_desc")c.sort((a,b)=>(b.prix??-1)-(a.prix??-1));
 else if(t==="marge")c.sort((a,b)=>(b.marge??-1e9)-(a.marge??-1e9));else if(t==="economie")c.sort((a,b)=>(b.economie??b.baisse_pct??-1)-(a.economie??a.baisse_pct??-1));
 else if(t==="date")c.sort((a,b)=>String(b.date_iso||b.vu||b.date||"").localeCompare(String(a.date_iso||a.vu||a.date||"")));
 else c.sort((a,b)=>({vert:0,orange:1,gris:2,rouge:3}[a.feu]??2)-({vert:0,orange:1,gris:2,rouge:3}[b.feu]??2)||(b.marge??-1e9)-(a.marge??-1e9));return c;}
function carte(x){const m=x.marge;const cm=typeof m==="number"?`<span class="marge ${m>=8?"pos":m<0?"neg":""}">${m>=0?"+":""}${m.toFixed(2).replace(".",",")} €</span>`:"—";
 return `<div class="carte ${x.feu}"><h3><span class="badge ${x.feu}">${e(x.verdict)}</span><span class="badge den">${e(x.denicheur)}</span>${x.bingo?'<span class="badge orange">BINGO</span>':""}<a href="${e(x.lien)}" target="_blank">${e(x.titre)}</a></h3>
 <div class="ligne"><b>${eur(x.prix)}</b> chez ${e(x.marchand)} (${e(x.pays)})${x.cout?` · coût rendu ${eur(x.cout)}`:""}${x.economie?` · <b>-${x.economie} %</b> vs neuf`:""}</div>
 <div class="ligne">Neuf le moins cher : ${eur(x.neuf_min)}${x.neuf_ou?` (${e(x.neuf_ou)})`:""} · Occasion : ${x.occ_bas||x.occ_haut?`${eur(x.occ_bas)} → ${eur(x.occ_haut)}`:"—"} · Revente retenue : ${eur(x.revente)} sur ${e(x.canal)} · Marge : ${cm}</div>
 <div class="ligne">${x.vendeurs!=null?`vendeurs Amazon : ${x.vendeurs} (concurrence ${e(x.concurrence)}) · `:""}${x.ean?`EAN ${e(x.ean)} · `:""}${x.ventes30!=null?`ventes Amazon 30 j : ${x.ventes30} · `:""}${x.volume_google?`recherches Google : ${x.volume_google}/mois (« ${e(x.mot_cle)} ») · `:""}${x.annonces_ebay!=null?`annonces eBay neuves : ${x.annonces_ebay} · `:""}${x.score_vente!=null?`score de vente : <b>${x.score_vente}</b> · `:""}${x.duree?`durée : ${e(x.duree)} · `:""}${e(x.date)} · source ${e(x.source)}</div>
 ${x.motif?`<div class="motif">${e(x.motif)}</div>`:""}</div>`;}
function rendre(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("actif",b.dataset.k===actif));document.querySelectorAll("section").forEach(s=>s.classList.toggle("actif",s.id==="s_"+actif));
 document.getElementById("barre").style.display=["affaires","alertes","radar"].includes(actif)?"flex":"none";let html="",n=0;
 if(actif==="affaires"){const l=trier(filtre(D.affaires));n=l.length;html=l.length?l.map(carte).join(""):`<div class="vide">Aucune affaire du passage ne correspond aux filtres.</div>`;if(!D.affaires.some(x=>x.feu==="vert"))html=`<div class="vide">Aucune carte verte à ce passage : voici toutes les affaires examinées avec le motif de l'audit. Les alertes Idéfix des 24 h sont dans l'onglet suivant.</div>`+html;}
 else if(actif==="alertes"){const l=trier(filtre(D.alertes));n=l.length;html=l.length?l.map(carte).join(""):`<div class="vide">Aucune alerte sur 24 h avec ces filtres.</div>`;}
 else if(actif==="radar"){const l=trier(filtre(D.radar.map(a=>({...a,feu:"gris",verdict:a.type,denicheur:"Radar Keepa",pays:"FR",marchand:"Amazon.fr",economie:a.baisse_pct,neuf_min:a.moyenne_90j,neuf_ou:"moyenne 90 j Amazon",date:a.vu,date_iso:a.vu,source:"keepa-radar"}))));n=l.length;html=`<div class="vide">Baisses de prix Amazon.fr (mise à jour ${e(D.radar_maj)}) : ce sont des pistes, pas des affaires vérifiées. Chaque baisse entre dans le passage suivant.</div>`+l.map(carte).join("");}
 else if(actif==="hype"){html=`<div class="vide">Meilleures ventes Amazon USA / Japon absentes ou mal vendues en France (mise à jour ${e(D.hype_maj)}). Trouvé par Amigo via Keepa.</div><table><tr><th>Pays</th><th>Produit</th><th>Catégorie</th><th>Ventes 30 j là-bas</th><th>Prix là-bas</th><th>En France</th><th>Prix FR</th></tr>`+D.hype.slice().sort((a,b)=>(b.ventes_30j_labas||0)-(a.ventes_30j_labas||0)).map(x=>`<tr><td>${e(x.pays)}</td><td><a href="${e(x.lien_fr)}" target="_blank">${e((x.titre||"").slice(0,100))}</a></td><td>${e(x.categorie)}</td><td><b>${e(x.ventes_30j_labas)}</b></td><td>${eur(x.prix_labas)}</td><td>${e(x.en_france)}</td><td>${eur(x.prix_fr)}</td></tr>`).join("")+"</table>";}
 else if(actif==="bingo"){html=`<div class="vide">Bingo = très recherché sur Google France (≥ 1 000/mois) ET peu de vendeurs (≤ 5 sur Amazon, ≤ 15 annonces eBay). ${e(D.bingo_info)} (mise à jour ${e(D.bingo_maj)}). Trouvé par Amigo.</div>`+(D.bingo.length?`<table><tr><th>Mot-clé</th><th>Recherches/mois</th><th>Vendeurs Amazon</th><th>Marchands France (idealo)</th><th>Annonces eBay</th><th>Prix Amazon</th><th>Neuf le moins cher FR</th><th>Origine</th></tr>`+D.bingo.map(x=>`<tr><td><b>${e(x.mot_cle)}</b><br><small>${e((x.titre||"").slice(0,80))}</small></td><td><b>${e(x.recherches_mois)}</b></td><td>${e(x.vendeurs)}</td><td>${e(x.marchands_france)}</td><td>${e(x.annonces_ebay)}</td><td>${eur(x.prix)}</td><td>${x.idealo?`<a href="${e(x.idealo.lien)}" target="_blank">${eur(x.prix_neuf_france)}</a>`:"—"}</td><td>${e(x.origine)}${x.ou_acheter?`<br><b>→ ${e(x.ou_acheter)}</b>`:""}</td></tr>`).join("")+"</table>":"")+(D.vagues.length?`<h3>Vagues à venir en France</h3><ul>${D.vagues.map(v=>`<li><b>${e(v.mot_cle)}</b> — monte dans ${e((v.monte_dans||[]).join(", "))}</li>`).join("")}</ul>`:"");}
 else if(actif==="demande"){html=`<div class="vide">Recherches en forte hausse sur idealo.fr (Amigo, mise à jour ${e(D.demande_maj)}) et, pour chacune, les promos vues par Idéfix dont le titre contient tous les mots.</div><table><tr><th>#</th><th>Recherche</th><th>Popularité</th><th>Hausse</th><th>Promos vues</th></tr>`+D.demande.map((x,i)=>`<tr><td>${i+1}</td><td><b>${e(x.recherche)}</b></td><td>${e(x.popularite)}</td><td>+${e(x.hausse)} %</td><td>${x.vues.length?x.vues.map(v=>`<a href="${e(v.lien)}" target="_blank">${eur(v.prix)} — ${e((v.titre||"").slice(0,60))}</a>`).join("<br>"):"—"}</td></tr>`).join("")+"</table>";}
 else if(actif==="arbitrage"){const A=D.arbitrage||[];html=`<div class="vide">Même produit moins cher sur Amazon Allemagne / Italie / Espagne qu'en France, port compris (Keepa, ${e(D.arbitrage_total)} produits comparés, mise à jour ${e(D.arbitrage_maj||"pas encore")}). Les meilleurs entrent dans le passage comme des affaires à vérifier. Trouvé par Amigo.</div>`+(A.length?`<table><tr><th>Produit</th><th>Acheter</th><th>Prix là-bas</th><th>Rendu FR</th><th>Prix Amazon.fr</th><th>Écart</th><th>Ventes 30 j FR</th><th>Vendeurs FR</th></tr>`+A.map(x=>`<tr><td><a href="${e(x.lien_fr)}" target="_blank">${e((x.titre||"").slice(0,90))}</a></td><td><a href="${e(x.lien_achat)}" target="_blank">Amazon ${e(x.pays_achat)}</a></td><td>${eur(x.prix_achat)}</td><td>${eur(x.cout_rendu)}</td><td>${eur(x.prix_fr)}</td><td class="pct"><b>-${e(x.ecart_pct)} %</b></td><td>${e(x.ventes_30j_fr)}</td><td>${e(x.vendeurs_fr)}</td></tr>`).join("")+"</table>":"<p>Première comparaison en cours (toutes les 10 minutes).</p>");}
 else if(actif==="sourceur"){const S=D.sourcing||[];html=`<div class="vide">Le Sourceur étudie chaque bingo : où il est fabriqué, qui le distribue, quel grossiste ou quelle usine, à quel prix, et un message de négociation prêt à envoyer (${e(S.length)} fiches, mise à jour ${e(D.sourcing_maj||"pas encore")}). Rien n'est envoyé automatiquement : c'est toi qui contactes.</div>`;
   const li=(arr,f)=>arr&&arr.length?"<ul>"+arr.map(f).join("")+"</ul>":"<i>aucun trouvé</i>";
   html+=S.map(x=>`<div class="carte ${x.type==="produit_usine"?"vert":x.type==="mixte"?"orange":"gris"}"><h3><span class="badge den">Sourceur</span><span class="badge">${e(x.type)}</span>${e(x.titre||x.mot_cle)}</h3>
   <div class="ligne">Recherches ${e(x.recherches_mois)}/mois · vendeurs Amazon ${e(x.vendeurs)} · prix FR ${eur(x.prix_fr)} · fabricant <b>${e(x.fabricant)}</b> (${e(x.pays_fabrication)}) · prix d'achat cible <b>${eur(x.prix_achat_cible_eur)}</b> · marge possible ${e(x.marge_possible_pct)} %</div>
   <div class="ligne"><b>Meilleure piste :</b> ${e(x.meilleure_piste)}</div>
   ${x.vendeurs_amazon&&x.vendeurs_amazon.length?`<div class="ligne"><b>Qui vend le moins cher sur Amazon.fr :</b> ${x.vendeurs_amazon.map(v=>`${e(v.vendeur||v.sellerId)} (${e(v.societe||"?")}, ${e(v.pays||"?")}) ${eur(v.prix)}`).join(" · ")}</div>`:""}
   ${x.comment_font_les_vendeurs?`<div class="ligne"><b>Comment font-ils :</b> ${e(x.comment_font_les_vendeurs)}</div>`:""}
   <div class="ligne"><b>Distributeurs officiels :</b> ${li(x.distributeurs_officiels,d=>`<li>${e(d.nom)} (${e(d.pays)}) — ${d.site?`<a href="${e(d.site)}" target="_blank">${e(d.site)}</a>`:""} · ${e(d.comment_contacter)} · ${e(d.conditions)}</li>`)}</div>
   <div class="ligne"><b>Grossistes :</b> ${li(x.grossistes,g=>`<li>${e(g.nom)} — ${g.site?`<a href="${e(g.site)}" target="_blank">${e(g.site)}</a>`:""} · ${e(g.prix_ou_remise)} · minimum ${e(g.minimum)} · ${e(g.note)}</li>`)}</div>
   <div class="ligne"><b>Usines / fournisseurs :</b> ${li(x.usines_ou_fournisseurs,u=>`<li>${e(u.nom)} (${e(u.plateforme)}) — ${u.lien?`<a href="${e(u.lien)}" target="_blank">lien</a>`:""} · ${eur(u.prix_unitaire_estime_eur)} · minimum ${e(u.quantite_minimum)} · ${e(u.delai_jours)} j · ${e(u.note)}</li>`)}</div>
   <div class="ligne"><b>Risques :</b> ${e((x.risques||[]).join(", "))}</div>
   <div class="motif"><b>Message de négociation :</b><br>${e(x.message_negociation).replace(/\n/g,"<br>")}</div>
   <div class="ligne"><small>Sources : ${(x.sources_google||x.sources||[]).slice(0,6).map(u=>`<a href="${e(u)}" target="_blank">${e(String(u).slice(0,50))}</a>`).join(" · ")}</small></div></div>`).join("");}
 else if(actif==="chasseur"){const C=D.chasse||[];html=`<div class="vide">Annonces de particuliers (Vinted, Leboncoin) trouvées par le Chasseur sur ton PC : sous-cotées (≤ 65 % du prix d'occasion), invisibles (titre mal écrit, lot) ou vendeur pressé. Mise à jour ${e(D.chasse_maj||"pas encore : attend le collecteur PC")} · ${e((D.chasse_etat||{}).recherches||0)} recherches, ${e((D.chasse_etat||{}).annonces_lues||0)} annonces lues au dernier tour.</div>`+(C.length?`<table><tr><th>Site</th><th>Annonce</th><th>Prix</th><th>Référence occasion</th><th>Écart</th><th>Signaux</th><th>Produit cherché</th><th>Vu</th></tr>`+C.map(x=>`<tr><td>${e(x.site)}</td><td><a href="${e(x.lien)}" target="_blank">${e(x.titre)}</a></td><td><b>${eur(x.prix)}</b></td><td>${eur(x.reference)}</td><td class="pct">${x.ecart_pct!=null?`-${e(x.ecart_pct)} %`:"—"}</td><td>${e((x.signaux||[]).join(", "))}</td><td>${e(x.produit)} <small>(${e(x.origine)})</small></td><td>${e((x.vu||"").slice(5,16).replace("T"," "))}</td></tr>`).join("")+"</table>":"");}
 else if(actif==="pays"){const P=D.demande_pays||{};const noms={FR:"🇫🇷 France",DE:"🇩🇪 Allemagne",ES:"🇪🇸 Espagne",IT:"🇮🇹 Italie",US:"🇺🇸 USA",JP:"🇯🇵 Japon"};
   html=`<div class="vide">Volume de recherches Google par pays (Amigo, DataForSEO, hebdomadaire — ${e(D.demande_pays_maj||"pas encore calculé")}) sur les produits de la base, croisé avec leur prix : qui cherche quoi, et dans quelle tranche de prix.</div>`;
   for(const [p,v] of Object.entries(P)){html+=`<h3>${noms[p]||p} — ${e(v.nb_avec_volume)} produits avec volume</h3><table><tr><th>Tranche de prix</th><th>Produits</th><th>Recherches / mois</th></tr>`+Object.entries(v.tranches||{}).map(([t,x])=>`<tr><td>${e(t)}</td><td>${e(x.produits)}</td><td><b>${e(x.recherches)}</b></td></tr>`).join("")+`</table><table><tr><th>#</th><th>Produit (mot-clé)</th><th>Recherches / mois</th><th>Prix</th><th>Vendeurs Amazon FR</th></tr>`+(v.top||[]).slice(0,30).map((x,i)=>`<tr><td>${i+1}</td><td><b>${e(x.mot_cle)}</b><br><small>${e(x.titre)}</small></td><td><b>${e(x.volume)}</b></td><td>${eur(x.prix)}</td><td>${e(x.vendeurs_amazon_fr)}</td></tr>`).join("")+"</table>";}
   if(!Object.keys(P).length)html+="<p>Première récolte lundi prochain (ou lancement manuel).</p>";}
 else if(actif==="outils"){html=`<table><tr><th>Outil</th><th>Consommé</th><th>Plafond</th><th>Appels</th></tr>`+D.outils.map(o=>`<tr><td>${e(o.outil)}</td><td>${e(o.mois)}</td><td>${e(o.plafond)}</td><td>${e(o.appels)}</td></tr>`).join("")+"</table>";}
 document.getElementById("s_"+actif).innerHTML=html;document.getElementById("compte").textContent=n?`${n} ligne(s)`:"";}
rendre();
</script></body></html>
